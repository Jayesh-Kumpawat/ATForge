[project]
name = "atforge"
version = "0.1.0"
description = "Agentic Trading Forge - self-improving multi-agent trading strategy and research system for NSE equities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.1.7",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "openchart==0.2.0",
    "jugaad-data>=0.33",
    "yfinance>=0.2.50",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pyarrow>=17.0.0",
    "ta-lib>=0.6.5",
    "pandas-ta-classic>=0.4.0",
    "scipy>=1.14.0",
    "vectorbt==0.28.4",
    "numba>=0.60.0",
    "langfuse>=4.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "structlog>=24.0.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "sse-starlette>=3.4.4",
]

[project.scripts]
atforge = "atforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atforge"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "freezegun>=1.5.0",
    "streamlit>=1.56.0",
    "plotly>=6.7.0",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line-too-long (formatter handles)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests requiring network (deselect with '-m \"not network\"')",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
exclude = ["^tests/"]
